[package]
name = "xurl-unofficial"
version = "0.1.0"
edition = "2021"
description = "Unofficial xurl-compatible CLI using X web GraphQL and session cookies"
license = "MIT"
readme = "README.md"

[lib]
name = "xurl_unofficial"
path = "src/lib.rs"

[[bin]]
name = "xurl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
open = "5.4.3"
pookie = "0.1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
